<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         CONFIGURACION GENERAL DEL DOCUMENTO
    ========================================= -->
    <!-- Define la codificacion de caracteristicas utilizadas por la página para permitir caracteres como acentos y la letra ñ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titulo que aparecerá en la pestaña del navegador -->
    <title>Sistema de Gestion Bancaria</title>

    <!-- =======================================
         HOJA DE ESTILOS
         Conectamos nuestro archivo HTML con la hoja de estilos principal
    ======================================= -->

    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <!-- ========================================= 
			CONTENIDO PRINCIPAL 
	========================================== -->

    <main class="app">
      <!-- Nombre principal de la aplicación -->
      <h1>Sistema de Gestión Bancaria</h1>

      <!-- Identificación del proyecto -->
      <p>Proyecto Integrador — Módulo 4</p>

      <!-- Versión actual del proyecto -->
      <p>Versión v0.2.0</p>
    </main>

    <!-- ========================================= 
				JAVASCRIPT PRINCIPAL
	Conectamos el archivo principal de JavaScript. 
	type="module" indica que utilizaremos módulos ES6, 
	permitiendo posteriormente trabajar con import y expor
	========================================== -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
